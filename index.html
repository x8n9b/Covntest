
  <!DOCTYPE html>
<html>
<head>
    <title>لعبة الكسر الاحترافية</title>
    <style>
        body { background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white; font-family: sans-serif; }
        canvas { background: #000; border: 4px solid #fff; box-shadow: 0 0 20px rgba(255,255,255,0.2); cursor: none; }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="480" height="320"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        let x = canvas.width/2; let y = canvas.height-30;
        let dx = 2; let dy = -2;
        const ballRadius = 10;
        const paddleHeight = 10; const paddleWidth = 75;
        let paddleX = (canvas.width-paddleWidth)/2;
        
        function drawBall() {
            ctx.beginPath(); ctx.arc(x, y, ballRadius, 0, Math.PI*2);
            ctx.fillStyle = "#0095DD"; ctx.fill(); ctx.closePath();
        }
        function drawPaddle() {
            ctx.beginPath(); ctx.rect(paddleX, canvas.height-paddleHeight, paddleWidth, paddleHeight);
            ctx.fillStyle = "#fff"; ctx.fill(); ctx.closePath();
        }
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBall(); drawPaddle();
            if(x + dx > canvas.width-ballRadius || x + dx < ballRadius) dx = -dx;
            if(y + dy < ballRadius) dy = -dy;
            else if(y + dy > canvas.height-ballRadius) {
                if(x > paddleX && x < paddleX + paddleWidth) dy = -dy;
                else { alert("GAME OVER"); document.location.reload(); }
            }
            x += dx; y += dy;
            requestAnimationFrame(draw);
        }
        document.addEventListener("mousemove", (e) => {
            let relativeX = e.clientX - canvas.offsetLeft;
            if(relativeX > 0 && relativeX < canvas.width) paddleX = relativeX - paddleWidth/2;
        });
        draw();
    </script>
</body>
</html>
